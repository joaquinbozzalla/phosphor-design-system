<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="ui-monospace, 'IBM Plex Mono', 'Courier New', monospace" role="img" aria-label="Phosphor Design System banner">
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="3" y2="0" stroke="#0f7a3a" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#f3efe4"/>
  <rect width="1200" height="360" fill="url(#scan)"/>
  <rect x="14" y="14" width="1172" height="332" fill="none" stroke="#0f7a3a" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="#0f7a3a" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>

  <g fill="#0f7a3a" font-size="14" letter-spacing="3" opacity="0.95">
    <text x="44" y="56">[ DESIGN SYSTEM ]</text>
    <text x="1156" y="56" text-anchor="end">v1 · MIT</text>
    <text x="44" y="336">LIGHT MODE · PRINTOUT</text>
    <text x="1156" y="336" text-anchor="end">JOAQUINBOZZALLA.COM</text>
  </g>

  <g>
    <text x="600" y="180" text-anchor="middle"
          font-size="96" font-weight="700" fill="#08381c" letter-spacing="6">PHOSPHOR</text>
    <text x="600" y="230" text-anchor="middle"
          font-size="22" fill="#0f7a3a" letter-spacing="10">DESIGN  ·  SYSTEM</text>
  </g>

  <g transform="translate(600, 280)" font-size="13" fill="#0f7a3a" letter-spacing="2" text-anchor="middle">
    <text>&gt; brand-agnostic · phosphor-green · CRT · dark + light · zero build</text>
  </g>

  <g transform="translate(44, 180)" stroke="#0f7a3a" stroke-opacity="0.6" fill="none">
    <circle r="22" stroke-dasharray="2 4"/>
    <circle r="12"/>
    <circle r="3" fill="#0f7a3a"/>
  </g>
  <g transform="translate(1156, 180)" stroke="#0f7a3a" stroke-opacity="0.6" fill="none">
    <circle r="22" stroke-dasharray="2 4"/>
    <circle r="12"/>
    <circle r="3" fill="#0f7a3a"/>
  </g>
</svg>
